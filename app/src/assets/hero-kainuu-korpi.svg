<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Sumuinen kainuulainen kuusikorpi auringonlaskussa, sammaleen keskellä lasinen viinapullo</title>
  <defs>
    <linearGradient id="taivas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16281f" />
      <stop offset="42%" stop-color="#3a5240" />
      <stop offset="72%" stop-color="#c97f45" />
      <stop offset="100%" stop-color="#f0b562" />
    </linearGradient>
    <radialGradient id="aurinko" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe6ab" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#ffcf7a" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffcf7a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sammal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4b6b3c" />
      <stop offset="100%" stop-color="#1f331c" />
    </linearGradient>
    <linearGradient id="pullonLasi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#274a33" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#3d6b46" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#142a1c" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="pullonNeste" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff0d8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#bcd9b2" stop-opacity="0.35" />
    </linearGradient>
    <filter id="sumea" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <filter id="pehmea-varjo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" />
    </filter>

    <g id="kuusi">
      <polygon points="50,0 96,70 68,70 100,128 66,128 104,190 -4,190 34,128 0,128 32,70 4,70" />
      <rect x="42" y="188" width="16" height="26" />
    </g>
  </defs>

  <rect x="0" y="0" width="800" height="460" fill="url(#taivas)" />
  <circle cx="430" cy="255" r="150" fill="url(#aurinko)" />

  <!-- Kaukaisin puurivistö: sumuun häipyvä -->
  <g fill="#4d6b52" opacity="0.5">
    <use href="#kuusi" transform="translate(-30,175) scale(0.55)" />
    <use href="#kuusi" transform="translate(60,185) scale(0.62)" />
    <use href="#kuusi" transform="translate(150,170) scale(0.5)" />
    <use href="#kuusi" transform="translate(240,190) scale(0.65)" />
    <use href="#kuusi" transform="translate(330,178) scale(0.55)" />
    <use href="#kuusi" transform="translate(420,188) scale(0.6)" />
    <use href="#kuusi" transform="translate(510,172) scale(0.5)" />
    <use href="#kuusi" transform="translate(600,186) scale(0.6)" />
    <use href="#kuusi" transform="translate(690,176) scale(0.55)" />
    <use href="#kuusi" transform="translate(770,190) scale(0.6)" />
  </g>

  <ellipse cx="400" cy="270" rx="440" ry="26" fill="#f4e4c8" opacity="0.3" filter="url(#sumea)" />

  <!-- Keskimmäinen puurivistö -->
  <g fill="#33502f" opacity="0.85">
    <use href="#kuusi" transform="translate(-40,230) scale(0.85)" />
    <use href="#kuusi" transform="translate(70,245) scale(0.95)" />
    <use href="#kuusi" transform="translate(190,225) scale(0.8)" />
    <use href="#kuusi" transform="translate(300,250) scale(1)" />
    <use href="#kuusi" transform="translate(420,228) scale(0.85)" />
    <use href="#kuusi" transform="translate(540,246) scale(0.95)" />
    <use href="#kuusi" transform="translate(650,224) scale(0.8)" />
    <use href="#kuusi" transform="translate(760,244) scale(0.9)" />
  </g>

  <ellipse cx="380" cy="320" rx="460" ry="22" fill="#f4e4c8" opacity="0.22" filter="url(#sumea)" />

  <!-- Etummainen, tummin puurivistö -->
  <g fill="#152A1D">
    <use href="#kuusi" transform="translate(-60,300) scale(1.3)" />
    <use href="#kuusi" transform="translate(110,320) scale(1.5)" />
    <use href="#kuusi" transform="translate(320,300) scale(1.35)" />
    <use href="#kuusi" transform="translate(520,322) scale(1.55)" />
    <use href="#kuusi" transform="translate(700,298) scale(1.3)" />
  </g>

  <!-- Sammalpeitteinen korpimaa -->
  <path
    d="M0,392 C90,368 160,410 250,388 C340,366 420,404 520,384 C610,366 700,400 800,382 L800,460 L0,460 Z"
    fill="url(#sammal)"
  />
  <g fill="#5c7a44" opacity="0.55">
    <ellipse cx="90" cy="410" rx="46" ry="12" />
    <ellipse cx="210" cy="430" rx="60" ry="14" />
    <ellipse cx="340" cy="405" rx="40" ry="10" />
    <ellipse cx="560" cy="428" rx="55" ry="13" />
    <ellipse cx="690" cy="408" rx="48" ry="11" />
  </g>
  <g fill="#243a1e" opacity="0.6">
    <ellipse cx="150" cy="418" rx="30" ry="8" />
    <ellipse cx="470" cy="415" rx="34" ry="9" />
    <ellipse cx="640" cy="435" rx="28" ry="7" />
  </g>

  <!-- Löydetty viinapullo sammalen keskellä -->
  <g transform="translate(392,352) rotate(-7)">
    <ellipse cx="34" cy="96" rx="46" ry="11" fill="#0c150e" opacity="0.4" filter="url(#pehmea-varjo)" />

    <path
      d="M18,0 L34,0 L34,22 C34,22 50,32 50,52 L50,92 C50,98 45,102 39,102 L13,102 C7,102 2,98 2,92 L2,52 C2,32 18,22 18,22 Z"
      fill="url(#pullonLasi)"
      stroke="#0d1f13"
      stroke-width="1.5"
    />
    <rect x="16" y="-10" width="4" height="10" fill="#0d1f13" />
    <rect x="4" y="58" width="44" height="30" fill="url(#pullonNeste)" opacity="0.7" />
    <rect x="8" y="66" width="30" height="14" rx="2" fill="#f4ecd8" opacity="0.85" />
    <line x1="10" y1="72" x2="30" y2="72" stroke="#8a6b3a" stroke-width="1.2" opacity="0.6" />
    <line x1="10" y1="76" x2="24" y2="76" stroke="#8a6b3a" stroke-width="1.2" opacity="0.6" />

    <path d="M9,28 C9,45 9,70 9,90" stroke="#ffffff" stroke-width="2" opacity="0.35" fill="none" stroke-linecap="round" />
  </g>

  <!-- Etualan varjostetut sammalmätäät pullon ympärillä -->
  <g fill="#12210f" opacity="0.5">
    <ellipse cx="330" cy="440" rx="70" ry="16" />
    <ellipse cx="470" cy="446" rx="80" ry="16" />
  </g>
</svg>
